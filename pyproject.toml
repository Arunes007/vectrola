[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vectrola"
version = "0.1.0"
description = "Multimodal Music Knowledge Graph - Semantic music search using audio embeddings and LLM synthesis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Vectrola Contributors"}
]
keywords = ["music", "ai", "embeddings", "semantic-search", "knowledge-graph"]

[project.urls]
Homepage = "https://github.com/Arunes007/vectrola"
Repository = "https://github.com/Arunes007/vectrola"
Issues = "https://github.com/Arunes007/vectrola/issues"
Documentation = "https://github.com/Arunes007/vectrola/blob/main/README.md"

dependencies = [
    # CLI & UI
    "typer>=0.9.0",
    "rich>=13.0",

    # Audio Processing
    "librosa>=0.10",
    "pydub>=0.25",

    # ML Models (Day 1: Whisper, Day 2+: sentence-transformers, CLAP)
    "faster-whisper>=1.0",

    # File Tagging
    "mutagen>=1.47",

    # Local LLM
    "ollama>=0.1",

    # Environment Variables
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
vectors = [
    # Day 2: Vector DB + Text Embeddings
    "qdrant-client>=1.7",
    "sentence-transformers>=2.2",
]
audio = [
    # Day 3: Audio Embeddings
    "transformers>=4.35",
    "torch>=2.1",
]
mcp = [
    # Day 5: Claude Code Integration
    "mcp[cli]>=1.0",
]
full = [
    "vectrola[vectors,audio,mcp]",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.scripts]
vectrola = "vectrola.cli:app"
vectrola-mcp = "vectrola.mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vectrola*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
